<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Bubu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Playfair+Display:wght@500;600;700&family=Dancing+Script:wght@500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --midnight: #1a0f1c;
            --plum: #3a1a2c;
            --wine: #7a2f45;
            --rose: #e0899a;
            --blush: #f6d3d9;
            --gold: #d9a86c;
            --cream: #fbeee9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: 'Cormorant Garamond', serif;
            background: radial-gradient(ellipse at 20% 10%, #4a2138 0%, transparent 55%),
                radial-gradient(ellipse at 80% 90%, #2a1730 0%, transparent 55%),
                linear-gradient(160deg, var(--midnight), var(--plum) 60%, #2c1626 100%);
            color: var(--cream);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* ---------- Ambient background: stars + drifting hearts ---------- */
        #stars {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: var(--cream);
            border-radius: 50%;
            opacity: .6;
            animation: twinkle 3.5s ease-in-out infinite;
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: .15;
            }

            50% {
                opacity: .85;
            }
        }

        .drift-heart {
            position: fixed;
            bottom: -40px;
            font-size: 1.2rem;
            color: var(--rose);
            opacity: .55;
            z-index: 0;
            pointer-events: none;
            animation: driftUp linear infinite;
        }

        @keyframes driftUp {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: .6;
            }

            90% {
                opacity: .5;
            }

            100% {
                transform: translateY(-110vh) translateX(var(--dx, 20px)) rotate(25deg);
                opacity: 0;
            }
        }

        .scene {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6vh 6vw;
            text-align: center;
        }

        .hidden {
            display: none !important;
        }

        .eyebrow {
            font-family: 'Playfair Display', serif;
            letter-spacing: .35em;
            text-transform: uppercase;
            font-size: .7rem;
            color: var(--gold);
            opacity: .85;
            margin-bottom: .8rem;
        }

        /* ---------- SCENE 1: Envelope ---------- */
        #envelope-wrap {
            cursor: pointer;
            user-select: none;
        }

        .envelope {
            position: relative;
            width: min(340px, 78vw);
            height: 220px;
            margin: 0 auto;
        }

        .env-back {
            position: absolute;
            inset: 0;
            background: linear-gradient(160deg, #f6e4d8, #ecd2c2);
            border-radius: 6px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .45);
        }

        .env-letter {
            position: absolute;
            left: 6%;
            right: 6%;
            top: 8%;
            height: 88%;
            background: linear-gradient(180deg, #fffaf3, #fbeee2);
            border-radius: 3px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, .25);
            transition: transform 1.1s cubic-bezier(.2, .8, .2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .env-letter span {
            font-family: 'Dancing Script';
            color: var(--wine);
            font-size: 1.4rem;
        }

        .env-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 0;
            border-style: solid;
            border-width: 0 170px 130px 170px;
            border-color: transparent transparent #e8c7b3 transparent;
            transform-origin: top;
            transition: transform 1s cubic-bezier(.4, 0, .2, 1);
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, .25));
            z-index: 3;
        }

        .env-front-left,
        .env-front-right {
            position: absolute;
            bottom: 0;
            width: 0;
            height: 0;
            border-style: solid;
            z-index: 2;
        }

        .env-front-left {
            left: 0;
            border-width: 110px 0 0 170px;
            border-color: transparent transparent transparent #f1dbc9;
        }

        .env-front-right {
            right: 0;
            border-width: 0 0 110px 170px;
            border-color: transparent transparent #f1dbc9 transparent;
        }

        .seal {
            position: absolute;
            top: calc(50% - 26px);
            left: 50%;
            transform: translateX(-50%);
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #b1445c, #7a2f45 70%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 14px rgba(0, 0, 0, .4), inset 0 0 8px rgba(0, 0, 0, .35);
            z-index: 4;
            font-size: 1.2rem;
            transition: transform .4s;
        }

        .envelope.open .env-flap {
            transform: rotateX(180deg);
        }

        .envelope.open .seal {
            transform: translateX(-50%) scale(0);
        }

        .envelope.open .env-letter {
            transform: translateY(-165px);
        }

        .tap-hint {
            margin-top: 2.4rem;
            font-family: 'Playfair Display';
            font-size: .85rem;
            letter-spacing: .12em;
            color: var(--blush);
            opacity: .75;
            animation: pulse 2.2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: .4;
            }

            50% {
                opacity: .9;
            }
        }

        h1.title {
            font-family: 'Playfair Display';
            font-weight: 600;
            font-size: clamp(1.8rem, 5vw, 2.6rem);
            margin-bottom: .4rem;
        }

        .script-name {
            font-family: 'Dancing Script';
            color: var(--rose);
            font-size: 1.3em;
        }

        /* ---------- SCENE 2: Letter cards ---------- */
        #letter-scene {
            display: none;
        }

        .card-stage {
            position: relative;
            width: min(560px, 90vw);
            min-height: 340px;
            perspective: 1400px;
        }

        .love-card {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(251, 238, 233, .06), rgba(251, 238, 233, .02));
            border: 1px solid rgba(217, 168, 108, .35);
            border-radius: 16px;
            padding: 2.4rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(6px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, .35);
            opacity: 0;
            transform: translateX(60px) rotateY(-8deg) scale(.96);
            transition: opacity .6s ease, transform .6s cubic-bezier(.2, .8, .2, 1);
            pointer-events: none;
        }

        .love-card.active {
            opacity: 1;
            transform: translateX(0) rotateY(0) scale(1);
            pointer-events: auto;
        }

        .love-card.exit-left {
            opacity: 0;
            transform: translateX(-60px) rotateY(8deg) scale(.96);
        }

        .card-index {
            font-family: 'Playfair Display';
            font-size: .75rem;
            letter-spacing: .3em;
            color: var(--gold);
            margin-bottom: 1rem;
        }

        .card-text {
            font-size: clamp(1.15rem, 3vw, 1.5rem);
            line-height: 1.6;
            font-style: italic;
            color: var(--cream);
            max-width: 44ch;
        }

        .card-text b {
            font-style: normal;
            color: var(--rose);
            font-weight: 600;
        }

        .dots {
            display: flex;
            gap: .5rem;
            margin-top: 2rem;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(251, 238, 233, .25);
            transition: .3s;
        }

        .dot.active {
            background: var(--rose);
            width: 22px;
            border-radius: 6px;
        }

        .nav-row {
            display: flex;
            gap: 1.2rem;
            margin-top: 1.8rem;
        }

        .nav-btn {
            font-family: 'Playfair Display';
            font-size: .85rem;
            letter-spacing: .08em;
            color: var(--cream);
            background: rgba(224, 137, 154, .12);
            border: 1px solid var(--rose);
            padding: .7rem 1.5rem;
            border-radius: 999px;
            cursor: pointer;
            transition: .25s;
        }

        .nav-btn:hover {
            background: var(--rose);
            color: #2a1220;
        }

        .nav-btn:disabled {
            opacity: .3;
            cursor: default;
            pointer-events: none;
        }

        .nav-btn.primary {
            background: var(--rose);
            color: #2a1220;
        }

        /* ---------- SCENE 4: Gift ---------- */
        #gift-scene {
            display: none;
        }

        .gift-box {
            width: 150px;
            height: 120px;
            position: relative;
            margin: 1rem auto 0;
            cursor: pointer;
        }

        .box-base {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 78px;
            background: linear-gradient(135deg, #8e2f4c, #5f1e35);
            border-radius: 6px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, .45);
        }

        .box-lid {
            position: absolute;
            top: 22px;
            width: 106%;
            left: -3%;
            height: 26px;
            background: linear-gradient(135deg, #a5395c, #6f2440);
            border-radius: 6px;
            transition: transform .7s cubic-bezier(.4, 0, .2, 1), opacity .7s;
            z-index: 3;
            transform-origin: top;
        }

        .ribbon-v {
            position: absolute;
            left: 50%;
            top: 22px;
            bottom: 0;
            width: 14px;
            margin-left: -7px;
            background: var(--gold);
            z-index: 2;
        }

        .ribbon-h {
            position: absolute;
            top: 22px;
            left: 0;
            right: 0;
            height: 14px;
            background: var(--gold);
            z-index: 2;
        }

        .bow {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.6rem;
            z-index: 4;
        }

        .gift-box.open .box-lid {
            transform: translateY(-70px) rotate(-18deg);
            opacity: 0;
        }

        .glow {
            position: absolute;
            left: 50%;
            top: 30px;
            transform: translateX(-50%);
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--gold);
            box-shadow: 0 0 40px 20px rgba(217, 168, 108, .5);
            opacity: 0;
            transition: opacity .5s .3s;
            z-index: 1;
        }

        .gift-box.open .glow {
            opacity: 1;
        }

        .reveal-text {
            margin-top: 2.4rem;
            font-family: 'Dancing Script';
            font-weight: 700;
            font-size: clamp(2.2rem, 7vw, 3.4rem);
            color: var(--rose);
            opacity: 0;
            transform: translateY(14px);
            transition: opacity .8s, transform .8s;
            text-shadow: 0 0 30px rgba(224, 137, 154, .5);
        }

        .reveal-text.show {
            opacity: 1;
            transform: translateY(0);
        }

        .sub-reveal {
            margin-top: .6rem;
            font-family: 'Playfair Display';
            font-size: .85rem;
            letter-spacing: .2em;
            text-transform: uppercase;
            color: var(--gold);
            opacity: 0;
            transition: opacity 1s .6s;
        }

        .sub-reveal.show {
            opacity: .9;
        }

        .confetti-piece {
            position: fixed;
            top: -10px;
            z-index: 50;
            pointer-events: none;
            border-radius: 2px;
        }

        footer.credit {
            position: fixed;
            bottom: 10px;
            width: 100%;
            text-align: center;
            font-size: .7rem;
            color: rgba(251, 238, 233, .35);
            z-index: 2;
            letter-spacing: .05em;
        }

        @media (prefers-reduced-motion: reduce) {

            .drift-heart,
            .tap-hint {
                animation: none !important;
            }

            .love-card,
            .env-flap,
            .env-letter,
            .box-lid,
            .reveal-text,
            .sub-reveal {
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <div id="stars"></div>

    <!-- SCENE 1: Envelope -->
    <section class="scene" id="envelope-scene">
        <div class="eyebrow">Happy Girlfriend's Day</div>
        <h1 class="title">For My <span class="script-name">Bubu</span></h1>
        <div id="envelope-wrap">
            <div class="envelope" id="envelope">
                <div class="env-back"></div>
                <div class="env-letter"><span>open me…</span></div>
                <div class="env-front-left"></div>
                <div class="env-front-right"></div>
                <div class="env-flap"></div>
                <div class="seal">❤</div>
            </div>
        </div>
        <div class="tap-hint">tap the seal to open</div>
    </section>

    <!-- SCENE 2: Letter -->
    <section class="scene" id="letter-scene">
        <div class="eyebrow">A Few Things I Need You To Know</div>
        <div class="card-stage" id="card-stage"></div>
        <div class="dots" id="dots"></div>
        <div class="nav-row">
            <button class="nav-btn" id="prevBtn">← back</button>
            <button class="nav-btn primary" id="nextBtn">next →</button>
        </div>
    </section>

    <!-- SCENE 3: Song -->
    <!-- SCENE 4: Gift -->
    <section class="scene" id="gift-scene">
        <div class="eyebrow">Last One, I Promise</div>
        <h1 class="title">A Little Gift</h1>
        <div class="gift-box" id="giftBox">
            <div class="glow"></div>
            <div class="box-base"></div>
            <div class="ribbon-v"></div>
            <div class="ribbon-h"></div>
            <div class="box-lid"></div>
            <div class="bow">🎀</div>
        </div>
        <div class="reveal-text" id="revealText">I love you bubu</div>
        <div class="sub-reveal" id="subReveal">happy girlfriend's day, my love</div>
    </section>

    <footer class="credit">made with love, one click at a time</footer>

    <script>
        /* ---------------- Ambient background ---------------- */
        const starsWrap = document.getElementById('stars');
        for (let i = 0; i < 70; i++) {
            const s = document.createElement('div');
            s.className = 'star';
            const size = Math.random() * 2 + 1;
            s.style.width = s.style.height = size + 'px';
            s.style.left = Math.random() * 100 + 'vw';
            s.style.top = Math.random() * 100 + 'vh';
            s.style.animationDelay = (Math.random() * 3) + 's';
            starsWrap.appendChild(s);
        }
        function spawnHeart() {
            const h = document.createElement('div');
            h.className = 'drift-heart';
            h.textContent = Math.random() > 0.5 ? '♥' : '♡';
            h.style.left = Math.random() * 100 + 'vw';
            h.style.setProperty('--dx', (Math.random() * 80 - 40) + 'px');
            const dur = 9 + Math.random() * 8;
            h.style.animationDuration = dur + 's';
            h.style.fontSize = (0.8 + Math.random() * 1.2) + 'rem';
            document.body.appendChild(h);
            setTimeout(() => h.remove(), dur * 1000 + 500);
        }
        setInterval(spawnHeart, 900);
        for (let i = 0; i < 6; i++) setTimeout(spawnHeart, i * 300);

        /* ---------------- Scene 1: Envelope ---------------- */
        const envelope = document.getElementById('envelope');
        const envelopeScene = document.getElementById('envelope-scene');
        const letterScene = document.getElementById('letter-scene');
        document.getElementById('envelope-wrap').addEventListener('click', () => {
            if (envelope.classList.contains('open')) return;
            envelope.classList.add('open');
            setTimeout(() => {
                envelopeScene.style.transition = 'opacity .6s';
                envelopeScene.style.opacity = '0';
                setTimeout(() => {
                    envelopeScene.style.display = 'none';
                    letterScene.style.display = 'flex';
                    requestAnimationFrame(() => letterScene.style.opacity = '1');
                    showCard(0);
                }, 600);
            }, 1300);
        });
        letterScene.style.opacity = '0';
        letterScene.style.transition = 'opacity .6s';

        /* ---------------- Scene 2: Letter cards ---------------- */
        const cards = [
            "You are the best girlfriend ever — because no matter what happens, you're always there to back me up and support me.",
            "And your eyes… they're so pretty, I swear I could just sink into them every time you look at me.",
            "You're always special to me. Somehow, every single time we're together, you make <b>me</b> feel special too.",
            "Whenever we meet, there's so much we get up to <b>(iykyk 😉)</b> — but honestly, the part I love most is just spending time with you. No matter what we're doing, as long as it's <i>us</i>, that's enough.",
            "One day, when we finally live together, I won't have to send you links like this anymore. I'll just look at you… and say all of it, right there, in front of you."
        ];

        const stage = document.getElementById('card-stage');
        const dotsWrap = document.getElementById('dots');
        let current = 0;

        cards.forEach((text, i) => {
            const c = document.createElement('div');
            c.className = 'love-card';
            c.innerHTML = `<div class="card-index">${String(i + 1).padStart(2, '0')} / ${String(cards.length).padStart(2, '0')}</div><div class="card-text">${text}</div>`;
            stage.appendChild(c);

            const d = document.createElement('div');
            d.className = 'dot';
            dotsWrap.appendChild(d);
        });

        function showCard(idx) {
            const allCards = stage.querySelectorAll('.love-card');
            const allDots = dotsWrap.querySelectorAll('.dot');
            allCards.forEach((c, i) => {
                c.classList.remove('active', 'exit-left');
                if (i === idx) c.classList.add('active');
                else if (i < idx) c.classList.add('exit-left');
            });
            allDots.forEach((d, i) => d.classList.toggle('active', i === idx));
            current = idx;
            document.getElementById('prevBtn').disabled = idx === 0;
            const nextBtn = document.getElementById('nextBtn');
            nextBtn.textContent = idx === cards.length - 1 ? 'one more thing →' : 'next →';
        }

        const giftScene = document.getElementById('gift-scene');
        giftScene.style.opacity = '0'; giftScene.style.transition = 'opacity .6s';
        function goToGift() {
            letterScene.style.opacity = '0';
            setTimeout(() => {
                letterScene.style.display = 'none';
                giftScene.style.display = 'flex';
                requestAnimationFrame(() => giftScene.style.opacity = '1');
            }, 600);
        }

        document.getElementById('nextBtn').addEventListener('click', () => {
            if (current < cards.length - 1) {
                showCard(current + 1);
            } else {
                goToGift();
            }
        });
        document.getElementById('prevBtn').addEventListener('click', () => {
            if (current > 0) showCard(current - 1);
        });

        /* ---------------- Scene 4: Gift box ---------------- */
        const giftBox = document.getElementById('giftBox');
        const revealText = document.getElementById('revealText');
        const subReveal = document.getElementById('subReveal');
        let giftOpened = false;
        giftBox.addEventListener('click', () => {
            if (giftOpened) return;
            giftOpened = true;
            giftBox.classList.add('open');
            setTimeout(() => {
                revealText.classList.add('show');
                subReveal.classList.add('show');
                burstConfetti();
            }, 500);
        });

        function burstConfetti() {
            const colors = ['#e0899a', '#d9a86c', '#f6d3d9', '#7a2f45'];
            for (let i = 0; i < 60; i++) {
                const p = document.createElement('div');
                p.className = 'confetti-piece';
                const size = Math.random() * 7 + 4;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.background = colors[Math.floor(Math.random() * colors.length)];
                p.style.left = Math.random() * 100 + 'vw';
                p.style.opacity = '0.9';
                document.body.appendChild(p);
                const fall = 2.2 + Math.random() * 1.8;
                const drift = (Math.random() * 160 - 80);
                p.animate([
                    { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
                    { transform: `translate(${drift}px, 100vh) rotate(${Math.random() * 720 - 360}deg)`, opacity: 0 }
                ], { duration: fall * 1000, easing: 'cubic-bezier(.2,.6,.4,1)' });
                setTimeout(() => p.remove(), fall * 1000 + 100);
            }
        }
    </script>
</body>

</html>
